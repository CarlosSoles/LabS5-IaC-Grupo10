- name: Configurar NGINX proxy
  hosts: localhost
  gather_facts: false
  vars:
    project_root: "{{ playbook_dir }}/.."
    nginx_conf_host: "{{ project_root }}/host_volumes/nginx_conf"
    web_conf_host: "{{ project_root }}/host_volumes/web"
    nginx_container: "nginx_proxy"
  tasks:
    - name: Crear las carpetas
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0775'
      loop:
        - '{{ nginx_conf_host }}'
        - '{{ web_conf_host }}'
        - '{{ web_conf_host }}/app_1'
        - '{{ web_conf_host }}/app_2'
        - '{{ web_conf_host }}/app_3'
        
    - name: Copiar la web 1
      ansible.builtin.copy:
        src: "files/index.html"
        dest: "{{ web_conf_host }}/app_1/index.html"
        mode: '0644'

    - name: Copiar la web 2
      ansible.builtin.copy:
        src: "files/index2.html"
        dest: "{{ web_conf_host }}/app_2/index.html"
        mode: '0644'

    - name: Copiar la web 3
      ansible.builtin.copy:
        src: "files/index3.html"
        dest: "{{ web_conf_host }}/app_3/index.html"
        mode: '0644'

    - name: Copiar la configuracion de NGINX
      ansible.builtin.copy:
      src: "templates/nginx.conf"
      dest: "{{ nginx_conf_host }}/default.conf"
      mode: "0644"

    - name: Intentar recargar NGINX
      ansible.builtin.command: >
        docker exec {{ nginx_container }} nginx -s reload
      register: reload_result
      changed_when: reload_result.rc == 0
      failed_when: false

    - name: Reiniciamos contenedor
      ansible.builtin.command: >
        sudo docker restart {{nginx_container}}
      when: reload_result.rc != 0